<h1>Descriere:</h1>
<ul>
  <li>Chipraiser este un prototip care se foloseste la cutia de Pringles.</li>
</ul>
<h1>Obiective:</h1>
<ul>
  <li>Sa poti ridica chipsurile fara inconvenienta de a rasuci cutia.</li>
  <li>Eliminarea riscului de a lasa firimituri pe diferite suprafete.</li>
  <li>Sa poti sa iei chipsurile intr-un mod mai convenabil.</li>
</ul>
